<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Personal Expense Tracker</a>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <h4 class="mb-1">Financial Dashboard</h4>
        <p class="text-muted small mb-4">Manage your income and expenses in one place.</p>

        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card p-3 summary-card">
                    <h6>Total Income</h6>
                    <h4 id="totalIncome" class="income-text">LKR 0.00</h4>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 summary-card">
                    <h6>Total Expenses</h6>
                    <h4 id="totalExpense" class="expense-text">LKR 0.00</h4>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3 summary-card">
                    <h6>Current Balance</h6>
                    <h4 id="currentBalance" class="balance-text">LKR 0.00</h4>
                </div>
            </div>
        </div>

        <div class="card p-4 mb-4">
            <h6 class="mb-3">Add a Transaction</h6>
            <form id="transactionForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Transaction Type</label>
                        <select class="form-select" id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Description</label>
                        <input type="text" class="form-control" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Amount (LKR)</label>
                        <input type="number" class="form-control" id="amount" placeholder="Enter amount" min="1" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Transaction Date</label>
                        <input type="date" class="form-control" id="date" required>
                    </div>
                </div>
                <div class="mt-2">
                    <button type="submit" class="btn btn-primary btn-sm px-3">Add Transaction</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm px-3" onclick="clearForm()">Clear Form</button>
                </div>
            </form>
        </div>

        <div class="card p-4">
            <h6 class="mb-3">Transaction History</h6>
            
            <div class="row mb-3">
                <div class="col-md-6 mb-2">
                    <label class="form-label small text-muted">Filter by Type</label>
                    <select class="form-select form-select-sm" id="filterType" onchange="renderTable()">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>
                <div class="col-md-6 mb-2">
                    <label class="form-label small text-muted">Search Transactions</label>
                    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search by description or category" onkeyup="renderTable()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th class="text-end">Amount (LKR)</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                    </tbody>
                </table>
            </div>
            <div id="noDataMessage" class="text-center text-muted py-3 small d-none">
                No transactions found.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
